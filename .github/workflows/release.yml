name: Build Windows EXE and attach to Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Hel Key Logger" --icon "assets\app.ico" --add-data "i18n;i18n" --add-data "assets;assets" main.py

      - name: Upload artifact (for workflow)
        uses: actions/upload-artifact@v4
        with:
          name: Hel-Key-Logger-windows
          path: dist/Hel Key Logger.exe

      - name: Attach EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hel Key Logger.exe